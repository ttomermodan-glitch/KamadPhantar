function winv(){const W=G.W||[];return `<div class="cols">${TK.map((t,i)=>{const w=W[i];return `<div class="card tc ${i<G.wn&&w?"win":""} ${i===G.wn-1&&G.age<1?"slam":""}" style="--tc:${TCL[t]}"><h3>${T[t][1]} ${T[t][0]}</h3>${i<G.wn?(w?`<div class="big" style="font-size:44px">🏆</div>${w.a.map(a=>`<p>${esc(a)}</p>`).join("")}<p class="mut">${esc(w.by)} · ${"★".repeat(Math.round(w.v))} ${w.v.toFixed(1)}</p>`:`<p class="mut">לא נאספו דירוגים.</p>`):`<p class="mut">ממתינים להכרזה...</p>`}</div>`}).join("")}</div>`}
function cmdv(){const p=G.ph;
if(p==="lobby")return `<div class="card"><h2>🎖️ ${esc(CMN)}</h2><p>ממתינים להתחלה. כשיגיעו תוצרים תראו אותם כאן בזמן אמת ותדרגו אותם מ־1 עד 5 כוכבים.</p><button class="lnk" onclick="CM=0;draw()">יציאה</button></div>`;
if(p==="story"||p==="twist")return stc();
if(p==="win")return winv();
const o=LN;LN=G.sub.length;
return `<div class="card">${clock()}<h3>🎖️ התוצרים בזמן אמת</h3><p class="mut">${G.sub.length} תוצרים עד עכשיו. דרגו כל תוצר מ־1 עד 5 כוכבים.</p></div>`+G.sub.map((x,i)=>`<div class="card ${i>=o?"slam":""}"><p class="mut">${T[x.t][1]} ${T[x.t][0]} · סבב ${x.r==="r1"?1:2} · ${esc(x.by)}</p>${x.a.map(a=>`<p>${esc(a)}</p>`).join("")}<div>${[1,2,3,4,5].map(n=>`<button class="st ${n<=(MY[x.id]||0)?"on":""}" onclick="rate(${x.id},${n})">★</button>`).join("")}</div></div>`).reverse().join("")}
function pendv(){return G.pend.length?`<div class="card"><h3>ממתינים לאישור כניסה</h3>${G.pend.map(e=>`<div class="it"><b>${esc(e.n)}</b> · ${T[e.t][1]} ${T[e.t][0]}<div class="ctl"><button class="go" onclick="act('ok',${e.id})">אשר</button><button onclick="act('no',${e.id})">דחה</button></div></div>`).join("")}</div>`:""}
async function doJoin(){const r=await api("join",{code:DR.c.trim(),name:DR.n.trim()});if(r.err){ERR=r.err;draw();return}ERR="";ME={id:r.id,role:r.role};try{sessionStorage.setItem("me",JSON.stringify(ME))}catch(e){}if(r.role==="c"){CM=1;CMN=r.name;LN=0}connect();draw()}
function act(a,k){api("act",{a,k})}
function roster(t){return G.ros.filter(x=>x.t===t).map(x=>x.n)}
function clock(){if(!isR())return"";const n=Math.max(np(),cn());const hot=G.t<=10&&!G.lock;return `<div id="rg" class="ring ${hot?"hot":""}"><svg viewBox="0 0 120 120"><circle class="rb" cx="60" cy="60" r="52"/><circle id="rf" class="rf" cx="60" cy="60" r="52" stroke-dasharray="327" stroke-dashoffset="${(327*(1-Math.min(1,G.t/RL))).toFixed(1)}"/></svg><div id="clk" class="clock ${hot?"hot":""}">${tm()}</div></div><p class="mut" style="text-align:center">${cn()} מתוך ${n} שלחו</p><div class="dots">${Array.from({length:n},(_,i)=>`<i class="${i<cn()?"on":""}"></i>`).join("")}</div>`}
function feed(){const f=FD[G.ph]||[],n=G.lock?f.length:Math.min(f.length,1+Math.floor(G.age/20));return `<div class="card"><h3>הרשת מגיבה</h3>${f.slice(0,n).map((x,i)=>`<p class="post ${i===n-1&&!G.lock&&G.age%20===0?"new":""}"><b>@${HN[i]}</b> ${x}</p>`).join("")}</div>`}
function stc(){const Z=CIN[G.ph],v=Z.filter(b=>b[0]<=G.age),jp=v.some(b=>b[0]===G.age&&b[1].startsWith("JUMP")),end=Z[Z.length-1][0]+2;
return `<div class="cin ${jp?"fl":""}">${v.map((b,i)=>{const j=b[1].startsWith("JUMP:");return `<p class="${j?"jump":""} ${i===0?"tm":""} ${i===v.length-1?"last":""} ${b[0]===G.age?"new":""}">${j?b[1].slice(5):b[1]}</p>`}).join("")}${G.age>end?`<p class="mut">הסבב יפתח בקרוב...</p>`:""}${G.ph==="twist"&&G.age>end?`<p class="learn">${R.r1.l}</p>`:""}</div>`}
function gal(){const o=order(),v=o.slice(0,G.shown),last=v[v.length-1];return `<div class="cols">${TK.map(t=>`<div class="card tc" style="--tc:${TCL[t]}"><h3>${T[t][1]} ${T[t][0]}</h3>${v.filter(x=>x.t===t).map(x=>`<div class="it ${x===last&&G.age<1?"slam":""}"><span class="mut">סבב ${x.r==="r1"?1:2} · ${esc(x.by)}</span>${x.a.map(a=>`<p>${esc(a)}</p>`).join("")}</div>`).join("")||`<p class="mut">ממתינים לרעיונות...</p>`}</div>`).join("")}</div>`+(G.shown>=o.length&&o.length?`<div class="card"><h3>מה למדנו על המערך</h3><p class="learn">${R.r1.l}</p><p class="learn">${R.r2.l}</p></div>`:"")}
function joinUI(){return `<div style="padding:26px 4px 6px"><span class="badge">מקרה בוחן</span><h1 class="hero" style="margin-top:14px">נחלון, 08:10</h1><p class="mut">הקלידו את קוד הכניסה שקיבלתם. הקוד קובע את המגמה שלכם.</p></div><div class="card"><input class="codein" inputmode="numeric" maxlength="5" placeholder="• • • • •" value="${esc(DR.c)}" oninput="DR.c=this.value"><input maxlength="20" placeholder="שם או כינוי" value="${esc(DR.n)}" oninput="DR.n=this.value"><button class="pri" onclick="doJoin()">הצטרפות</button><p class="err">${ERR}</p><p class="mut">מי שמצטרף אחרי שהמשחק התחיל ממתין לאישור המנהל.</p></div><p style="text-align:center;margin-top:30px"><button class="lnk" onclick="go('alogin')">כניסה אדמין</button></p>`}
function waitv(){return `<div class="card"><h2>ממתינים לאישור</h2><p>הבקשה נשלחה למנהל. תיכנסו ברגע שיאשר אתכם.</p></div>`}
function play(){const p=G.ph;
if(p==="lobby")return `<div class="card tc" style="--tc:${TCL[G.trk]}"><span class="chip">${T[G.trk][1]} ${T[G.trk][0]}</span><h2 style="margin-top:12px">✓ הצטרפת, ${esc(G.name)}.</h2><p>${np()===1?"אתם לבד בחדר, וזה בסדר.":np()+" משתתפים בחדר."} המנהל יתחיל בקרוב.</p></div>`;
if(p==="story"||p==="twist")return stc();
if(p==="show")return gal();
if(p==="win")return winv();
const k=R[p][G.trk];
return `<div class="card tc" style="--tc:${TCL[G.trk]}">${clock()}<h2 class="${G.age<1?"slam":""}">${R[p].t}</h2><span class="chip">${T[G.trk][1]} ${T[G.trk][0]}</span><p style="margin-top:12px">${k.q}</p>${k.ex?`<details ${EXO?"open":""} ontoggle="EXO=this.open"><summary>דוגמאות רשמיות של צה״ל</summary>${EX.map(x=>`<p class="post">${x}</p>`).join("")}</details>`:""}${G.fl?FL:""}${G.sent[p]?`<p class="ok">נשלח. מחכים לשאר המחלקה.</p>`:G.lock?`<p class="mut">הזמן נגמר.</p>`:k.f.map((f,i)=>`<label class="mut">${f}</label><textarea id="f${i}" maxlength="${i?100:220}" rows="2" oninput="DF.f${i}=this.value">${esc(DF["f"+i]||"")}</textarea>`).join("")+`<button class="pri" onclick="submit()">שליחה</button>`}</div>`+feed()}
function screen(){
if(!AUTH&&!LINK)return `<div class="card scr"><h2>ממתינים לאדמין</h2><p class="mut">פתחו את לוח הבקרה בטלפון כדי לחבר את המסך.</p></div>`;
const p=G.ph;
if(p==="lobby")return `<div class="card scr"><h2>הצטרפו בקוד</h2><div class="cols">${TK.map(t=>`<div class="tile" style="--tc:${TCL[t]}"><h3>${T[t][1]} ${T[t][0]}</h3><div class="code">${TC[t]}</div><div class="names">${roster(t).map(n=>`<span class="chip">${T[t][1]} ${esc(n)}</span>`).join("")||`<span class="mut">ממתינים לראשון...</span>`}</div><p class="mut">${roster(t).length} הצטרפו</p></div>`).join("")}</div><p>${np()} משתתפים בחדר</p></div>`;
if(p==="story"||p==="twist")return `<div class="scr">${stc()}</div>`;
if(p==="show")return `<div class="scr">${gal()}</div>`;
if(p==="win")return `<div class="scr">${winv()}</div>`;
return `<div class="card scr">${clock()}<h2 class="${G.age<1?"slam":""}">${R[p].t}</h2>${G.fl?FL:""}</div><div class="cols">${TK.map(t=>`<div class="card tc" style="--tc:${TCL[t]}"><h3>${T[t][1]} ${T[t][0]}</h3><p>${R[p][t].q}</p></div>`).join("")}</div>`+feed()}
function admin(){const i=PHS.indexOf(G.ph),nx=PHS[i+1],r=isR(),L=G.ph==="lobby",d=c=>c?"disabled":"";
const pre=nx?({story:"הצגת הסיפור",r1:"הסבב הראשון",twist:"שינוי בסיפור: ההתרעה התבררה כשווא",r2:"הסבב השני",show:"תצוגת הרעיונות",win:"הכרזת המנצחים לפי הדירוג"})[nx]:"אין, זה השלב האחרון";
const st=({lobby:"ממתין להפעלה",story:"הסיפור על המסך",twist:"השינוי בסיפור על המסך",show:"הרעיונות מוצגים",win:"המנצחים על המסך"})[G.ph]||(G.lock?"הסבב נסגר":G.pause?"מושהה":"הסבב פתוח");
return `${pendv()}<div class="card"><p class="mut">קודי כניסה, אחד לכל מגמה</p><div class="cols">${TK.map(t=>`<div class="tile" style="--tc:${TCL[t]}"><b>${T[t][1]} ${T[t][0]}</b><div class="code">${TC[t]}</div></div>`).join("")}</div><p class="mut">קוד מפקדים: <b>${CC}</b></p><div class="ctl"><button onclick="go('screen')">מסך הקרנה</button><button onclick="go('join')">יציאה לדף הבית</button><button style="grid-column:1/-1" onclick="act('dm')" ${d(r)}>${G.demo?"מצב דמו: פועל, 23 משתתפים מדומים":"מצב דמו: כבוי, רק משתתפים אמיתיים"}</button></div></div>
<div class="card"><h3>לוח בקרה</h3><div class="g3"><div><b>${np()}</b>מחוברים</div><div><b>${r?cn():0}</b>הגשות</div><div><b>${pad(i)}/06</b>שלב</div></div></div>
<div class="card"><p class="mut">שלב נוכחי</p><h3>${ttl(G.ph)}</h3><p>${st}</p>${L?`<p class="mut">הצטרפו: ${TK.map(t=>T[t][1]+" "+roster(t).length).join(" · ")}</p>`:""}${G.ph==="show"||G.ph==="win"?`<p class="mut">${G.sub.length} תוצרים · ${(G.rc||0)} דירוגים</p>`:""}${clock()}${r?`<p class="mut">${TK.map(t=>T[t][0]+" "+G.sub.filter(x=>x.t===t&&x.r===G.ph).length).join(" · ")}</p>`:""}<p class="mut">מבט מקדים, רק לך: ${pre}</p>
<div class="ctl"><button class="go" onclick="act('nx')" ${d(G.ph==="show")}>${L?"התחל":"השלב הבא"}</button><button onclick="act('ps')" ${d(!r)}>${G.pause?"המשך":"השהה"}</button><button onclick="act('cl')" ${d(!r||G.lock)}>סגור סבב</button><button onclick="act('tm')" ${d(!r||G.lock)}>הוסף 30 שניות</button><button onclick="act('tw')" ${d(!r)}>מבזק פתע</button><button onclick="act('lk')">${G.locked?"פתח כניסה":"נעל כניסה"}</button><button onclick="act('sn')" ${d(G.ph!=="show")}>הצג רעיון הבא</button><button onclick="act('sa')" ${d(G.ph!=="show")}>הצג הכול</button><button style="grid-column:1/-1" onclick="act('wn')" ${d(G.ph!=="win")}>חשוף מנצח הבא</button><button style="grid-column:1/-1" onclick="act('rs')">איפוס משחק</button></div></div>`+conn()+tcard()+``}
function cmpCard(){if(!G.cmp)return"";return `<div class="card"><h3>מה רואים המשתתפים</h3><div class="pv">${play()}</div></div><div class="card"><h3>מה רואים בהקרנה</h3><div class="pv">${screen()}</div></div>`}
function tcard(){return `<div class="card"><h3>בדיקה והדגמה</h3><div class="ctl"><button class="go" onclick="act('au')">${G.auto?"עצור הרצה אוטומטית":"הרצה אוטומטית עד הסוף"}</button><button onclick="act('rs')">התחלה מחדש</button></div></div>`}
function conn(){const o=location.origin;return `<div class="card"><h3>חיבור מכשירים</h3><p>משתתפים: <b>${o}</b><br>מסך הקרנה: <b>${o}/#screen</b><br>שליטה מהטלפון: <b>${o}/#admin</b></p><p class="mut">מחובר לשרת בזמן אמת.</p></div>`}
function alogin(){return `<div class="card"><h2>כניסת מנהל</h2><input id="pw" type="password" autocomplete="off" placeholder="סיסמה" onkeydown="if(event.key==='Enter')doAdmin()"><button class="pri" onclick="doAdmin()">כניסה</button><p class="err">${AE}</p><button class="lnk" onclick="go('join')">חזרה</button></div>`}
async function doAdmin(){const r=await api("login",{pw:document.getElementById("pw").value});if(r.tok){TOK=r.tok;try{sessionStorage.setItem("tok",TOK)}catch(e){}AE="";AUTH=1;V="admin";connect()}else AE="הסיסמה שגויה.";draw()}
function head(){const tx=G.ph==="lobby"?"ממתינים להתחלת השידור":ttl(G.ph);return `<div class="tick"><span class="live"><span class="dot"></span>שידור חי</span><span class="mqw"><span class="mq">${tx} · ${NEWS}</span></span><button class="snd" onclick="togSnd()">${SOUND?"🔊":"🔇"}</button></div>`}
function beep(f,d,t,v){if(!SOUND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.08;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function togSnd(){SOUND=!SOUND;if(SOUND)beep(660,.12,"triangle");draw()}
function sfx(){const ck=G.ph+"@"+G.age;if(ck!==LK){LK=ck;const ev=CIN[G.ph]&&CIN[G.ph].find(b=>b[0]===G.age);if(ev){if(ev[1].startsWith("JUMP")){beep(300,.25,"sawtooth",.1);setTimeout(()=>beep(220,.4,"sawtooth",.1),260)}else beep(520,.2,"sine",.05)}}
const s=G.ph+"|"+G.fl,[p0,f0]=LS.split("|");
if(s!==LS){
if(G.ph!==p0&&G.ph!=="lobby"){if(G.ph==="show"){[392,523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.5,"triangle"),i*140))}else{beep(880,.15,"square");setTimeout(()=>beep(660,.3,"square"),170)}}
if(String(G.fl)==="1"&&f0!=="1"){beep(300,.25,"sawtooth",.1);setTimeout(()=>beep(220,.4,"sawtooth",.1),260)}
LS=s}
if(isR()&&!G.lock&&G.t<=10&&G.t>0&&G.t!==LT){LT=G.t;beep(G.t<=3?1200:900,.08,"square")}}
function route(){const h=location.hash.slice(1);V=h==="screen"?"screen":h==="admin"?(AUTH?"admin":"alogin"):"join";connect();draw()}
function go(v){const h=v==="screen"?"screen":v==="join"?"":"admin";V=v;if(location.hash.slice(1)!==h)location.hash=h;connect();draw()}
addEventListener("hashchange",route);
function sync(){}
function draw(){sync();{const h=head();if(h!==HDL){document.getElementById("hd").innerHTML=h;HDL=h}}document.getElementById("app").innerHTML=(V==="admin"?admin():V==="screen"?screen()+(AUTH?`<p style="text-align:center"><button class="lnk" onclick="go('admin')">חזרה ללוח הבקרה</button></p>`:""):V==="alogin"?alogin():CM?cmdv():G.joined?play():G.wait?waitv():joinUI());sfx()}
function tickDraw(){if(V==="admin"||V==="screen"||(V==="join"&&(G.joined||CM||G.wait))){const a=document.activeElement;
if(a&&a.tagName==="TEXTAREA"){const c=document.getElementById("clk");if(c){const h=G.t<=10&&!G.lock,rf=document.getElementById("rf"),rg=document.getElementById("rg");c.textContent=tm();c.className="clock"+(h?" hot":"");if(rf)rf.style.strokeDashoffset=(327*(1-Math.min(1,G.t/RL))).toFixed(1);if(rg)rg.className="ring"+(h?" hot":"")}sfx()}else draw()}}
function applySnap(d){
if(d.codes){TC=d.codes.TC||TC;if(d.codes.CC)CC=d.codes.CC;delete d.codes}
if(d.me!==undefined){const m=d.me;G.joined=m&&m.st==="in"?1:0;G.wait=m&&m.st==="wait"?1:0;if(m){G.trk=m.trk;G.name=m.name;G.sent=m.sent||{};if(m.st==="no"){ERR="הבקשה נדחתה על ידי המנהל.";dropMe()}}delete d.me}
if(d.my){MY=d.my;delete d.my}
Object.assign(G,d);LINK=1;tickDraw()}
function dropMe(){ME=null;CM=0;G.joined=0;G.wait=0;try{sessionStorage.removeItem("me")}catch(e){}if(ES){ES.close();ES=null}draw()}
function connect(){if(ES){ES.close();ES=null}LINK=0;
const q=V==="screen"?"role=s":(V==="admin"&&TOK)?"role=a&tok="+TOK:ME?"role="+(ME.role==="c"?"c":"p")+"&id="+ME.id:"";
if(!q)return;const es=new EventSource("/api/stream?"+q);ES=es;
es.onmessage=e=>applySnap(JSON.parse(e.data));
es.onerror=()=>{LINK=0;if(es.readyState===2){if(V==="admin"){AUTH=0;TOK="";try{sessionStorage.removeItem("tok")}catch(e){}V="alogin";draw()}else if(ME)dropMe()}}}
try{ME=JSON.parse(sessionStorage.getItem("me")||"null");TOK=sessionStorage.getItem("tok")||"";if(TOK)AUTH=1;if(ME&&ME.role==="c"){CM=1;CMN="מפקד"}}catch(e){}
route();
</script></body></html>
