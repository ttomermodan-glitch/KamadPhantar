const pre=nx?({story:"הצגת הסיפור",r1:"הסבב הראשון",show:"הצגת כל התוצרים של שלב 1",twist:"התפתחות חדשה במבצע",r2:"הסבב השני",show2:"הצגת כל התוצרים של שלב 2",twist3:"בקשת פרטים שלא אושרו",r3:"הסבב השלישי",show3:"הצגת תוצרי שלב 3",twist4:"עדכון הנחיות לציבור",r4:"הסבב הרביעי",show4:"הצגת תוצרי שלב 4",twist5:"סיכום הגל הראשון",r5:"הסבב החמישי",show5:"הצגת תוצרי שלב 5",win:"הכרזת המנצחים לפי הדירוג"})[nx]:"אין, זה השלב האחרון";
const st=({lobby:"ממתין להפעלה",story:"הסיפור על המסך",twist:"השינוי בסיפור על המסך",twist3:"התפתחות חדשה על המסך",twist4:"התפתחות חדשה על המסך",twist5:"התפתחות חדשה על המסך",show:"כל תוצרי שלב 1 מוצגים",show2:"כל תוצרי שלב 2 מוצגים",show3:"כל תוצרי שלב 3 מוצגים",show4:"כל תוצרי שלב 4 מוצגים",show5:"כל תוצרי שלב 5 מוצגים",win:"המנצחים על המסך"})[G.ph]||(G.lock?"הסבב נסגר":G.pause?"מושהה":"הסבב פתוח");
return `${pendv()}<div class="card"><p class="mut">קודי כניסה, אחד לכל מגמה</p><div class="cols">${TK.map(t=>`<div class="tile" style="--tc:${TCL[t]}"><b>${T[t][1]} ${T[t][0]}</b><div class="code">${TC[t]}</div></div>`).join("")}</div><p class="mut">קוד מפקדים: <b>${CC}</b></p><div class="ctl"><button onclick="go('screen')">מסך הקרנה</button><button onclick="go('join')">יציאה לדף הבית</button><button style="grid-column:1/-1" onclick="act('dm')" ${d(r)}>${G.demo?"מצב דמו: פועל, 23 משתתפים מדומים":"מצב דמו: כבוי, רק משתתפים אמיתיים"}</button></div></div>
<div class="card"><h3>לוח בקרה</h3><p class="mut">מפקדים מחוברים: ${G.nc||0} (לא נספרים כמשתתפים)</p><div class="g3"><div><b>${np()}</b>משתתפים מחוברים</div><div><b>${r?cn():0}</b>הגשות</div><div><b>${pad(i)}/16</b>שלב</div></div></div>
<div class="card"><p class="mut">שלב נוכחי</p><h3>${ttl(G.ph)}</h3><p>${st}</p>${L?`<p class="mut">הצטרפו: ${TK.map(t=>T[t][1]+" "+roster(t).length).join(" · ")}</p>`:""}${(/^show[2-5]?$/.test(G.ph)||G.ph==="win")?`<p class="mut">${G.sub.length} תוצרים · ${(G.rc||0)} דירוגים</p>`:""}${clock()}${r?`<p class="mut">${TK.map(t=>T[t][0]+" "+G.sub.filter(x=>x.t===t&&x.r===G.ph).length).join(" · ")}</p>`:""}<p class="mut">מבט מקדים, רק לך: ${pre}</p>
<div class="ctl"><button class="go" onclick="act('nx')">${L?"התחל":"השלב הבא"}</button><button onclick="act('ps')" ${d(!r)}>${G.pause?"המשך":"השהה"}</button><button onclick="act('cl')" ${d(!r||G.lock)}>סגור סבב</button><button onclick="act('tm')" ${d(!r||G.lock)}>הוסף 30 שניות</button><button onclick="act('tw')" ${d(!r)}>מבזק פתע</button><button onclick="act('lk')">${G.locked?"פתח כניסה":"נעל כניסה"}</button><button style="display:none" onclick="act('sn')" ${d(G.ph!=="show")}>הצג רעיון הבא</button><button style="display:none" onclick="act('sa')" ${d(G.ph!=="show")}>הצג הכול</button><button style="grid-column:1/-1" onclick="act('wn')" ${d(G.ph!=="win")}>חשוף מנצח הבא</button><button style="grid-column:1/-1" onclick="act('rs')">איפוס משחק</button></div></div>`+factsCard(G.ph)+conn()+tcard()+``}
function cmpCard(){if(!G.cmp)return"";return `<div class="card"><h3>מה רואים המשתתפים</h3><div class="pv">${play()}</div></div><div class="card"><h3>מה רואים בהקרנה</h3><div class="pv">${screen()}</div></div>`}
function tcard(){return `<div class="card"><h3>משך המשחק המלא</h3><p>5 סבבי יצירה × 3 דקות = 15 דקות. ארבע התפתחויות עלילתיות ופתיחה = כ־3 דקות. הצגת תוצרים ודירוג אחרי כל סבב: מומלץ 75 שניות × 5 = 6:15 דקות. סיכום והכרזת מנצחים: דקה עד שתיים. <b>סה״כ: כ־25 דקות</b>.</p><p class="mut">השלבים הקולנועיים והתוצרים מתקדמים אוטומטית. מצב הרצה אוטומטית מהירה מיועד רק לבדיקות ומקצר את הזמנים. אפשר להשהות או לדלג ידנית בלוח הבקרה.</p></div><div class="card"><h3>בדיקה והדגמה</h3><div class="ctl"><button class="go" onclick="act('au')">${G.auto?"עצור בדיקה מהירה":"בדיקה מהירה (מקצר זמנים)"}</button><button onclick="act('rs')">התחלה מחדש</button></div></div>`}
function conn(){const o=location.origin;return `<div class="card"><h3>חיבור מכשירים</h3><p>משתתפים: <b>${o}</b><br>מסך הקרנה: <b>${o}/#screen</b><br>שליטה מהטלפון: <b>${o}/#admin</b></p><p class="mut">מחובר לשרת בזמן אמת.</p></div>`}
function alogin(){return `<div class="card"><h2>כניסת מנהל</h2><input id="pw" type="password" autocomplete="off" placeholder="סיסמה" onkeydown="if(event.key==='Enter')doAdmin()"><button class="pri" onclick="doAdmin()">כניסה</button><p class="err">${AE}</p><button class="lnk" onclick="go('join')">חזרה</button></div>`}
async function doAdmin(){const r=await api("login",{pw:document.getElementById("pw").value});if(r.tok){TOK=r.tok;try{sessionStorage.setItem("tok",TOK)}catch(e){}AE="";AUTH=1;V="admin";connect()}else AE="הסיסמה שגויה.";draw()}
function head(){const tx=G.ph==="lobby"?"ממתינים להתחלת השידור":ttl(G.ph);return `<div class="tick"><span class="live"><span class="dot"></span>שידור חי</span><span class="mqw"><span class="mq">${tx} · ${NEWS}</span></span><button class="snd" onclick="togSnd()">${SOUND?"🔊":"🔇"}</button></div>`}
function beep(f,d,t,v){if(!SOUND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=v||.08;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function togSnd(){SOUND=!SOUND;if(SOUND)beep(660,.12,"triangle");draw()}
function sfx(){const ck=G.ph+"@"+G.age;if(ck!==LK){LK=ck;const ev=CIN[G.ph]&&CIN[G.ph].find(b=>b[0]===G.age);if(ev){if(ev[1].startsWith("JUMP")){beep(300,.25,"sawtooth",.1);setTimeout(()=>beep(220,.4,"sawtooth",.1),260)}else beep(520,.2,"sine",.05)}}
const s=G.ph+"|"+G.fl,[p0,f0]=LS.split("|");
if(s!==LS){
if(G.ph!==p0&&G.ph!=="lobby"){if(/^show[2-5]?$/.test(G.ph)){[392,523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.5,"triangle"),i*140))}else{beep(880,.15,"square");setTimeout(()=>beep(660,.3,"square"),170)}}
if(String(G.fl)==="1"&&f0!=="1"){beep(300,.25,"sawtooth",.1);setTimeout(()=>beep(220,.4,"sawtooth",.1),260)}
LS=s}
if(isR()&&!G.lock&&G.t<=10&&G.t>0&&G.t!==LT){LT=G.t;beep(G.t<=3?1200:900,.08,"square")}}
function route(){const h=location.hash.slice(1);V=h==="screen"?"screen":h==="admin"?(AUTH?"admin":"alogin"):"join";connect();draw()}
function go(v){const h=v==="screen"?"screen":v==="join"?"":"admin";V=v;if(location.hash.slice(1)!==h)location.hash=h;connect();draw()}
addEventListener("hashchange",route);
function sync(){}
function draw(){sync();{const h=head();if(h!==HDL){document.getElementById("hd").innerHTML=h;HDL=h}}document.getElementById("app").innerHTML=(V==="admin"?admin():V==="screen"?screen()+(AUTH?`<p style="text-align:center"><button class="lnk" onclick="go('admin')">חזרה ללוח הבקרה</button></p>`:""):V==="alogin"?alogin():CM?cmdv():G.joined?(play()+(G.ph!=="lobby"?`<p style="text-align:center"><button class="lnk" onclick="leaveGame()">יציאה מהמשחק</button></p>`:"")):G.wait?(waitv()+`<p style="text-align:center"><button class="lnk" onclick="leaveGame()">ביטול בקשת הצטרפות</button></p>`):joinUI());sfx()}
function tickDraw(){if(V==="admin"||V==="screen"||(V==="join"&&(G.joined||CM||G.wait))){const a=document.activeElement;
if(a&&a.tagName==="TEXTAREA"){const c=document.getElementById("clk");if(c){const h=G.t<=10&&!G.lock,rf=document.getElementById("rf"),rg=document.getElementById("rg");c.textContent=tm();c.className="clock"+(h?" hot":"");if(rf)rf.style.strokeDashoffset=(327*(1-Math.min(1,G.t/RL))).toFixed(1);if(rg)rg.className="ring"+(h?" hot":"")}sfx()}else draw()}}
function applySnap(d){
if(d.codes){TC=d.codes.TC||TC;if(d.codes.CC)CC=d.codes.CC;delete d.codes}
if(d.me!==undefined){const m=d.me;G.joined=m&&m.st==="in"?1:0;G.wait=m&&m.st==="wait"?1:0;if(m){G.trk=m.trk;G.name=m.name;G.sent=m.sent||{};if(m.st==="no"){ERR="הבקשה נדחתה על ידי המנהל.";dropMe()}}delete d.me}
if(d.my){MY=d.my;delete d.my}
Object.assign(G,d);LINK=1;tickDraw()}
function dropMe(){ME=null;CM=0;G.joined=0;G.wait=0;try{sessionStorage.removeItem("me")}catch(e){}if(ES){ES.close();ES=null}draw()}
function connect(){if(ES){ES.close();ES=null}LINK=0;
const q=V==="screen"?"role=s":(V==="admin"&&TOK)?"role=a&tok="+TOK:ME?"role="+(ME.role==="c"?"c":"p")+"&id="+ME.id:"";
if(!q)return;const es=new EventSource("/api/stream?"+q);ES=es;
es.onmessage=e=>applySnap(JSON.parse(e.data));
es.onerror=()=>{LINK=0;if(es.readyState===2){if(V==="admin"){AUTH=0;TOK="";try{sessionStorage.removeItem("tok")}catch(e){}V="alogin";draw()}else if(ME)dropMe()}}}
try{ME=JSON.parse(sessionStorage.getItem("me")||"null");TOK=sessionStorage.getItem("tok")||"";if(TOK)AUTH=1;if(ME&&ME.role==="c"){CM=1;CMN="מפקד"}}catch(e){}
route();
// Notify the server when a participant deliberately closes or leaves the page.
addEventListener("pagehide",()=>{if(ME&&ME.role==="p"){
 const id=ME.id;try{navigator.sendBeacon("/api/leave",new Blob([JSON.stringify({id,temporary:1})],{type:"application/json"}))}catch(e){}
}});
</script></body></html>
