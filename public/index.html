<style>
@import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@400;600;700;800;900&display=swap');

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Assistant,Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 0%,#172741 0%,var(--bg) 65%);font-size:18px}body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.13;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px}h1,h2,h3,h4{font-family:Heebo,Assistant,Arial,sans-serif;line-height:1.25;margin:0}h1{font-size:clamp(38px,6vw,72px);font-weight:900}h2{font-size:clamp(26px,4vw,42px)}h3{font-size:23px}p{margin:0;line-height:1.6}button,input,textarea{font:inherit}button{cursor:pointer;transition:background .15s,transform .12s}button:active{transform:scale(.985)}button:disabled{opacity:.45;cursor:not-allowed}input,textarea{border:1px solid #3a5676;background:#0c1626;color:var(--ink);width:100%;border-radius:13px;padding:13px 15px;outline:none}input:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 2px #58b6f325}textarea{resize:vertical;min-height:98px}label{display:block;font-size:15px;color:var(--mut);font-weight:800;margin-bottom:7px}.btn{background:#283c58;border:1px solid #4a617b;border-radius:12px;padding:12px 18px;color:var(--ink);font-weight:800;text-align:center;min-height:46px}.btn.primary{background:linear-gradient(110deg,#ec4266,#f17d5f);border-color:transparent;box-shadow:0 9px 30px #fa587e30}.btn.alt{background:#18394b;border:1px solid #3c9b9d}.btn.light{background:transparent;border:1px solid #52657b}.btn.small{padding:6px 11px;min-height:34px;font-size:14px}.btn.danger{background:#512c3c;border-color:#a44864}.btn.full{width:100%}.btn.selected{border-color:var(--green);background:#183e49;color:#eafff6}.btnrow{display:flex;flex-wrap:wrap;gap:8px}.btnrow .btn{flex:1}.page{max-width:1020px;margin:0 auto;padding:20px 20px 70px}.page.wide{max-width:1560px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 20px;flex-wrap:wrap}.brand{font-family:Heebo,sans-serif;font-weight:900;letter-spacing:.04em;font-size:20px}.brand span{color:var(--red)}.mut{color:var(--mut)}.small{font-size:15px}.micro{font-size:12px}.strong{font-weight:800}.panel{padding:24px;background:linear-gradient(135deg,#172740,#101c2e);border:1px solid var(--line);border-radius:20px;margin:14px 0;box-shadow:0 14px 35px #0003}.pane{background:#111f34;border:1px solid #2f4560;border-radius:15px;padding:17px}.center{text-align:center}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#92a9c6}.pill{border:1px solid #455979;color:#d8e5f5;border-radius:999px;font-size:14px;padding:4px 12px;display:inline-flex;align-items:center;gap:5px;font-weight:800}.pill.hot{background:var(--red);border-color:var(--red);color:white}.pill.good{border-color:var(--green);color:var(--green)}.space{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:12px}.grid2,.grid3,.grid4{display:grid;gap:14px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.big-num{font-family:Heebo;font-size:clamp(38px,5vw,68px);line-height:1.1;font-weight:900}.hero{padding:45px 25px;text-align:center;background:radial-gradient(circle at center top,#293e5d,#101a2a 70%);border-radius:23px;border:1px solid #3e5472}.hero h1{margin:8px 0 16px}.hero .copy{max-width:710px;margin:auto;color:#c4d3e7;font-size:21px}.group{border-top:5px solid var(--group);background:linear-gradient(145deg,#1b2d47,#111b2e);border-radius:17px;padding:18px;border-inline-start:1px solid #374a65;border-inline-end:1px solid #374a65;border-bottom:1px solid #374a65}.group h3{color:var(--group)}.groupname{font-family:Heebo;font-weight:800;color:var(--group)}.tally{font-family:Heebo;font-size:40px;font-weight:900}.clock{font:900 clamp(38px,6vw,66px)/1 Heebo,Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.04em}.progress{height:9px;background:#2a3950;border-radius:8px;overflow:hidden;margin-top:13px}.progress>div{height:100%;background:linear-gradient(90deg,var(--a),var(--green));transition:width .3s}.separator{border:0;border-top:1px solid #364a65;margin:19px 0}.step{font-size:13px;color:var(--mut);letter-spacing:.05em;font-weight:900;margin-bottom:10px}.prompt{font-size:clamp(20px,2.3vw,27px);line-height:1.55}.callout{padding:14px 16px;background:#20344e;border-inline-start:4px solid var(--a);border-radius:10px;color:#dce8f7}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;color:white;background:#203a53;border:1px solid #5a7896;box-shadow:0 12px 40px #0009;border-radius:14px;padding:12px 20px;text-align:center;max-width:min(90vw,600px);display:none}.toast.show{display:block}.score-buttons{display:flex;gap:6px;flex-wrap:wrap}.score-buttons button{flex:1;min-width:47px;max-width:92px}.inputrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.review-card{position:relative;background:linear-gradient(145deg,#203451,#0e1b2f);border:1px solid #4a6182;border-top:8px solid var(--accent,var(--a));border-radius:23px;padding:clamp(20px,4vw,50px);box-shadow:0 20px 60px #0006;max-width:1050px;margin:22px auto;min-height:320px;display:flex;flex-direction:column;justify-content:center;animation:arrive .45s ease-out}.review-card .letter{color:var(--accent,var(--a));font:900 27px Heebo}.review-card h2{margin:16px 0}.review-card p{font-size:clamp(19px,2.6vw,30px);line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}@keyframes arrive{from{opacity:.1;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}.display{min-height:calc(100vh - 110px);}.display .hero{padding:50px 32px}.display .hero h1{font-size:clamp(56px,7vw,110px)}.display .panel{padding:30px}.display h2{font-size:clamp(32px,4.3vw,65px)}.display .prompt{font-size:clamp(22px,3.2vw,42px)}.display .big-num{font-size:clamp(70px,8vw,130px)}.screen-rank{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.screen-rank .pane{min-height:120px}.note{border-right:4px solid var(--a);padding:16px;background:#213450;border-radius:10px;line-height:1.5;overflow-wrap:anywhere}.note .quote{font-size:20px;margin-top:9px}.labelhead{font-size:13px;color:var(--mut);font-weight:800}.voteitem{padding:20px;border:1px solid #35516f;background:#15273d;border-radius:16px;margin-top:10px}.voteitem.disabled{opacity:.45}.badge-slot{background:#354c6b;display:inline-flex;align-items:center;justify-content:center;width:45px;height:45px;border-radius:12px;font-size:26px;font-weight:900}.voteitem .score-buttons{margin-top:12px}.member{border:1px solid #3b526c;border-radius:12px;padding:8px 10px;display:inline-flex;gap:8px;align-items:center;font-size:15px;margin:4px}.member button{padding:3px 7px;color:#ffb2bf;border:0;background:transparent}.kicker{font-size:clamp(70px,15vw,200px)!important;letter-spacing:-.05em;color:#ff657c;text-shadow:0 9px 32px #f0546833}.results-card{border-right:5px solid var(--group);padding:20px;background:#17263b;border-radius:15px}.final-winner{border-color:#dfb363;background:radial-gradient(ellipse at top,#3c3651,#101c30 80%)}.checklist{display:grid;gap:10px}.check{border:1px solid #36506e;border-radius:12px;padding:12px}.notice{border:1px solid #7e6852;background:#30283a;color:#ffe0ab;border-radius:12px;padding:13px}.danger-text{color:#ff8997}.footer{margin-top:25px;color:#748cab;text-align:center;font-size:12px}.view-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.view-tabs button{min-width:85px}.fake{min-height:200px}.hidden{display:none}
@media(max-width:800px){.page{padding:13px 12px 50px}.panel{padding:17px}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.display .panel{padding:19px}.display .hero{padding:25px 15px}.screen-rank{grid-template-columns:1fr}.previewgrid{grid-template-columns:1fr!important}.review-card{min-height:270px}}
@media(max-width:580px){.grid3,.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.btnrow{flex-direction:column}.btnrow .btn{width:100%}.page{padding:10px}.hero{padding:28px 12px}.group{padding:13px}.top{gap:7px}.review-card{padding:20px}.review-card p{font-size:19px}.inputrow{grid-template-columns:1fr}}

/* Compact soundtrack controls are visible on the projector only. */
.sound-desk{position:fixed;bottom:12px;left:12px;z-index:50;background:#0a1422ee;border:1px solid #4a6484;box-shadow:0 12px 35px #0009;border-radius:14px;width:min(340px,calc(100vw - 24px));padding:11px 13px;direction:rtl;font-size:14px;line-height:1.4}
.sound-desk .btn{min-height:32px;padding:5px 9px;font-size:13px}.sound-desk .sound-buttons{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}.sound-desk .sound-track{font-weight:900;color:#e6f1ff}.sound-desk .sound-status{color:#c3d2e8}.sound-desk .sound-order{font-size:12px;color:#97b0d0}.sound-desk button:focus-visible{outline:2px solid #5fdbb3;outline-offset:2px}
@media(max-width:580px){.sound-desk{max-width:280px;font-size:12px}}

/* Projector lobby: scan the QR to open the player join page. */
.join-spot{display:grid;grid-template-columns:minmax(0,1fr) 220px;align-items:center;gap:26px;max-width:870px;margin:30px auto 15px;text-align:right}
.join-code-large{font-family:Heebo,Assistant,sans-serif;font-size:clamp(60px,9vw,116px);font-weight:900;letter-spacing:.05em;line-height:1.1;color:var(--green);direction:ltr;text-align:right}
.join-qr-box{background:#fff;padding:14px;border-radius:18px;border:2px solid #def6ff;box-shadow:0 12px 34px #0006;justify-self:center;width:220px;height:220px;display:flex;justify-content:center;align-items:center}
.join-qr-box img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.join-qr-hint{font-size:19px;color:#d5e6f4;font-weight:800}
.join-url{color:#aac4e4;direction:ltr;unicode-bidi:plaintext;overflow-wrap:anywhere;font-size:16px;display:block;margin-top:11px}
@media(max-width:640px){.join-spot{grid-template-columns:1fr;gap:14px;justify-items:center;text-align:center}.join-code-large{text-align:center}.join-qr-box{width:190px;height:190px}}

<body><div id="app"></div><div id="toast" class="toast" aria-live="polite"></div><audio id="playlist-audio" preload="none" playsinline></audio>
<script>
'use strict';
const BUILD='2026.11.11-concepts.4';
const COLORS=['#5dbaf2','#e9ac54','#c393fc'];
const NAMES=['א','ב','ג'];
let token=sessionStorage.getItem('news404_concept_token')||'',role=sessionStorage.getItem('news404_concept_role')||'',me={},S=null,stream=null,lastKey='',pending=false;
let joinForm={name:'',code:''},adminPassword='',drafts={},judgeDrafts={},previewRound=0,previewPhase='write';
let cooldownUntil=0,previousName='',toastTimeout=null;
const $=x=>document.querySelector(x), el=x=>document.getElementById(x);
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const attr=escapeHtml;
const gColor=g=>COLORS[(g-1+3)%3];
const time=s=>{s=Math.max(0,Math.ceil(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const grade=x=>x===null||x===undefined?'—':Number(x).toFixed(2);
const PAGES=['intro','write1','reveal1','vote1','results1','write2','reveal2','vote2','results2','write3','reveal3','vote3','results3','finale'];
function toast(msg){const x=el('toast');x.textContent=msg;x.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>x.classList.remove('show'),3600)}
async function call(path,data={},withAuth=true){let r;try{r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json',...(withAuth?{'x-session':token}:{})},body:JSON.stringify(data)});}catch{throw new Error('אין תקשורת עם השרת')};let obj;try{obj=await r.json()}catch{throw new Error('השרת לא החזיר תשובה תקינה')};if(!r.ok)throw Object.assign(new Error(obj.error||'הפעולה נכשלה'),{data:obj,status:r.status});return obj}
function setAuth(t,r,details={}){token=t;role=r;me=details;sessionStorage.setItem('news404_concept_token',t);sessionStorage.setItem('news404_concept_role',r);lastKey='';connect()}
function logout(){if(stream){stream.close();stream=null}token='';role='';me={};S=null;lastKey='';sessionStorage.removeItem('news404_concept_token');sessionStorage.removeItem('news404_concept_role');render()}
function lose(err){const info=err?.data||{};if(info.kickUntil){cooldownUntil=info.kickUntil;previousName=info.previousName||''}logout();toast(err.message||'החיבור הסתיים')}

// Projector-only playlist. This is intentionally not played on participant/judge devices.
const SONGS=['Hakpaza.mp3','Hapaza2.mp3','Hapaza3.mp3'];
const sound=el('playlist-audio');
let songIndex=0,soundEnabled=false,soundBlocked=false,soundMuted=false,soundError='',soundMissing=new Set(),introFaded=false,fadeHandle=null,lastSoundPhase='lobby',soundBootstrapping=false;
function musicActive(){return role==='screen'&&S&&['intro','write1','write2','write3'].includes(S.phase)&&!S.paused&&S.remaining>0}
function setSong(i){songIndex=(i+SONGS.length)%SONGS.length;sound.src='/'+SONGS[songIndex];sound.load();updateMusicStatus()}
function cancelFade(){if(fadeHandle){clearInterval(fadeHandle);fadeHandle=null}}
function resetPlaylist(){cancelFade();sound.pause();sound.removeAttribute('src');sound.load();songIndex=0;introFaded=false;soundMissing.clear();soundBlocked=false;soundError='';updateMusicStatus()}
function fadeIntro(){
 if(introFaded||songIndex!==0||S?.phase!=='intro')return;
 introFaded=true;cancelFade();
 const initial=0.70,target=0.10,started=Date.now(),fadeMs=7000;
 sound.volume=initial;
 fadeHandle=setInterval(()=>{const fraction=Math.min(1,(Date.now()-started)/fadeMs);sound.volume=initial+(target-initial)*fraction;if(fraction>=1)cancelFade()},180);
}
function playSong(){
 if(!musicActive()||!soundEnabled||soundBlocked)return;
 if(!sound.getAttribute('src'))setSong(songIndex);
 if(!introFaded&&songIndex===0&&S?.phase==='intro')sound.volume=.70;
 else sound.volume=.10;
 sound.muted=soundMuted;
 const result=sound.play();
 if(result&&result.catch)result.catch(e=>{
  if(sound.error)return; // A missing file is handled by the error event.
  soundBlocked=true;soundError='הדפדפן חסם ניגון אוטומטי. לחצו ״הפעל מוזיקה״ במקרן.';
  updateMusicStatus();
 });
 updateMusicStatus();
}
function nextSong(){
 cancelFade();soundMissing.delete(songIndex);songIndex=(songIndex+1)%SONGS.length;
 setSong(songIndex);if(musicActive()&&soundEnabled)playSong();
}
function syncMusic(){
 if(role!=='screen'||!S){sound.pause();return}
 if(lastSoundPhase!=='lobby'&&S.phase==='lobby')resetPlaylist();
 lastSoundPhase=S.phase;
 if(!musicActive()){cancelFade();sound.pause();if(introFaded)sound.volume=.10;updateMusicStatus();return}
 if(soundEnabled&&sound.paused&&!soundBlocked&&!soundBootstrapping)playSong();
 updateMusicStatus();
}
function toggleMusic(){
 if(!soundEnabled||soundBlocked){
  soundEnabled=true;soundBlocked=false;soundError='';
  if(musicActive()){playSong();return}
  // A user gesture is required in many browsers. Try to unlock before the start.
  if(!sound.getAttribute('src'))setSong(0);
  soundBootstrapping=true;sound.volume=0;sound.muted=true;
  const p=sound.play();
  if(p&&p.then)p.then(()=>{sound.pause();sound.currentTime=0;sound.volume=.10;sound.muted=soundMuted;soundBootstrapping=false;updateMusicStatus()}).catch(()=>{
   soundBootstrapping=false;soundBlocked=true;soundError='כשהמשחק מתחיל, לחצו שוב ״הפעל מוזיקה״ במקרן.';updateMusicStatus();
  });
 }else{
  soundEnabled=false;cancelFade();sound.pause();updateMusicStatus();
 }
}
function muteMusic(){soundMuted=!soundMuted;sound.muted=soundMuted;updateMusicStatus()}
function musicPanel(){return `<aside class="sound-desk" aria-label="פלייליסט מסך ההקרנה"><div class="space"><strong>♫ פלייליסט המקרן</strong><span id="song-now" class="sound-track"></span></div><div class="sound-buttons"><button class="btn small alt" onclick="toggleMusic()" id="music-toggle">הפעל מוזיקה</button><button class="btn small" onclick="nextSong()">השיר הבא</button><button class="btn small" onclick="muteMusic()" id="music-mute">השתק</button></div><div class="sound-order">Hakpaza → Hapaza2 → Hapaza3 → חוזר</div><div id="music-status" class="sound-status" aria-live="polite"></div></aside>`}
function updateMusicStatus(){
 const current=el('song-now'),status=el('music-status'),toggle=el('music-toggle'),mute=el('music-mute');
 if(current)current.textContent=SONGS[songIndex];
 if(toggle)toggle.textContent=(!soundEnabled||soundBlocked)?'הפעל מוזיקה':'עצור מוזיקה';
 if(mute)mute.textContent=soundMuted?'בטל השתקה':'השתק';
 if(status)status.textContent=soundError||(!soundEnabled?'לחצו להפעלת פס הקול במקרן.':musicActive()?(sound.paused?'מוכן לניגון':'מנגן ברקע · 10% לאחר הפתיחה'):'מושהה בזמן הצגה, הצבעה ודירוג.');
}
sound.addEventListener('playing',()=>{if(songIndex===0&&S?.phase==='intro'&&!introFaded)fadeIntro();updateMusicStatus()});
sound.addEventListener('pause',updateMusicStatus);
sound.addEventListener('ended',()=>{if(musicActive()&&soundEnabled)nextSong()});
sound.addEventListener('error',()=>{
 if(!soundEnabled)return;
 soundMissing.add(songIndex);
 if(soundMissing.size>=SONGS.length){
  soundEnabled=false;soundError='שלושת קובצי ה־MP3 חסרים או לא ניתנים לניגון. העלו אותם לתיקייה public.';sound.pause();updateMusicStatus();return;
 }
 songIndex=(songIndex+1)%SONGS.length;
 setSong(songIndex);if(musicActive())playSong();
});

async function init(){
 if(location.hash==='#screen'){try{const r=await call('screen',{},false);setAuth(r.token,r.role,r)}catch(e){toast(e.message)}return}
 if(token){try{const r=await call('resume',{token});role=r.role;me=r;setAuth(token,role,me);return}catch{logout()}}
 render();
}
function connect(){if(stream)stream.close();render();stream=new EventSource('/api/stream?token='+encodeURIComponent(token));stream.addEventListener('state',e=>{try{const next=JSON.parse(e.data);const key=renderKey(next);S=next;syncMusic();if(key!==lastKey){lastKey=key;render()}else updateClock()}catch(err){console.warn(err)}});stream.addEventListener('revoked',e=>{let v={};try{v=JSON.parse(e.data)}catch{}lose(Object.assign(new Error('הוצאת מהמשחק. אפשר לחזור אחרי 20 שניות עם שם חדש.'),{data:{kickUntil:v.kickUntil,previousName:v.previousName}}))});stream.onerror=()=>{if(token)el('net-status')&&(el('net-status').textContent='מתחבר מחדש...')}}
function slotIndex(s){const p=s.phase;if(p.startsWith('reveal'))return Math.min(2,Math.floor((s.duration-s.remaining)/25));if(p.startsWith('results'))return Math.min(2,Math.floor((s.duration-s.remaining)/5));if(p==='finale')return Math.min(4,Math.floor((s.duration-s.remaining)/18));return 0}
function renderKey(s){let k=role+'|'+s.phase+'|'+(s.approved??'')+'|'+(s.remaining===0?'expired':'live')+'|';if(role==='admin')return k+s.version+'|'+s.paused;
 if(role==='screen')return k+(s.phase==='lobby'?s.version:0)+'|'+slotIndex(s)+'|'+s.paused;
 if(role==='player')return k+s.myGroup+'|'+(s.mySubmission?.updatedAt||0)+'|'+JSON.stringify(s.myVotes||{});
 if(role==='judge')return k+JSON.stringify(s.myRatings||{});
 if(role==='preview')return k+previewRound+'|'+previewPhase;
 return k;
}
function header(){const phaseText=S?.phase==='lobby'?'ממתינים לפתיחה':S?.started?'מחוברים':'כניסה';const branding=S?.started&&S?.phase!=='lobby'?'הקפצה!':'פעילות מחלקה';return `<header class="top"><div class="brand"><span>NEWS</span>404 <span style="color:#9dc2e9;font-size:13px">/ ${branding}</span></div><div class="btnrow" style="align-items:center"><span class="pill small" id="net-status">${S?'● '+phaseText:'מתחבר...'}</span>${role&&role!=='screen'?`<button class="btn small light" onclick="logout()">יציאה</button>`:''}</div></header>`}
function frame(content,wide=false){document.title=S?.started&&S?.phase!=='lobby'?'NEWS404 | הקפצה!':'NEWS404 | פעילות מחלקה';el('app').innerHTML=`<div class="page ${wide?'wide':''}">${header()}${content}<div class="footer">NEWS404 · ${BUILD}${S?.build?' · שרת '+escapeHtml(S.build):''}</div></div>${role==='screen'?musicPanel():''}`;updateClock();updateMusicStatus()}
function render(){if(!el('app'))return;
 if(!token){return renderLogin()}
 if(!S){return frame(`<div class="panel center"><h2>מתחברים לשרת...</h2><p class="mut">מסנכרנים את המסך.</p></div>`)}

async function join(ev){ev.preventDefault();if(pending)return;pending=true;try{let device=localStorage.getItem('news404_concept_device');if(!device){device=crypto.randomUUID();localStorage.setItem('news404_concept_device',device)}const r=await call('join',{...joinForm,device},false);setAuth(r.token,r.role,r)}catch(e){if(e.data?.kickUntil){cooldownUntil=e.data.kickUntil;previousName=e.data.previousName||''}toast(e.message);render()}finally{pending=false}}
async function loginAdmin(ev){ev.preventDefault();try{const r=await call('login',{password:adminPassword},false);adminPassword='';setAuth(r.token,r.role,r)}catch(e){toast(e.message)}}
const phGroup=s=>Math.max(0,(s.round||1)-1);

function renderPlayer(){const p=S.phase,r=phGroup(S);
 if(!S.approved)return frame(`<div class="panel center"><h2>ממתינים לאישור כניסה</h2><p class="mut">האדמין יכול לאשר הצטרפות אחרי שהמשחק התחיל.</p></div>`);
 if(p==='lobby')return frame(`<div class="hero"><span class="pill good">התחברת</span><h1>קבוצה ${S.myGroup}</h1><p class="copy">ממתינים לפתיחת המשחק.</p></div><div class="panel"><h3>הקבוצה שלך</h3><p class="mut">${S.members.filter(x=>x.group===S.myGroup).map(x=>escapeHtml(x.name)).join(' · ')||escapeHtml(S.myName)}</p></div>`);
 if(p==='intro')return frame(`<div class="hero"><div class="eyebrow">הודעה דחופה</div><h1 class="kicker">הקפצה!</h1><p class="copy">אחרי שבוע כזה, יש רק דבר אחד סביר לעשות: להמציא את הרעיון הכי לא סביר שיש.</p>${ticking('מוכנים?')}</div>`);

 if(p.startsWith('write')){

 }

 if(p.startsWith('vote')){

function saveDraft(r,key,val){if(!drafts[r])drafts[r]={title:'',description:''};drafts[r][key]=val}

function judgeCard(x,r){const d=(judgeDrafts[r]??={})[x.slot]??=(S.myRatings?.[x.group]||{score:0,reason:''});const done=S.myRatings?.[x.group];return `<div class="voteitem" style="border-right:5px solid ${COLORS[x.slot]}"><div class="space"><div class="strong" style="font-size:22px">קונספט ${x.label}</div><span class="pill ${done?'good':''}">${done?'✓ דירוג נשמר':'ממתין לדירוג'}</span></div>${x.submission?`<h3 style="margin:12px 0">${escapeHtml(x.submission.title)}</h3><p>${escapeHtml(x.submission.description)}</p><hr class="separator"><label>ציון (1 עד 5)</label><div class="score-buttons">${[1,2,3,4,5].map(n=>`<button class="btn ${d.score===n?'selected':''}" onclick="changeJudge(${r},${x.slot},'score',${n})">${n} ★</button>`).join('')}</div><label style="margin-top:14px">למה נתת את הציון הזה? (חובה)</label><textarea rows="2" maxlength="220" oninput="changeJudge(${r},${x.slot},'reason',this.value)">${escapeHtml(d.reason)}</textarea><button class="btn alt full" onclick="rateJudge(${x.slot},${r})">שמור ציון ונימוק</button>`:`<p class="mut">לא הוגש קונספט בכרטיסייה הזאת.</p>`}</div>`}

function revealCard(){const r=phGroup(S),slot=slotIndex(S),x=S.display?.[slot],sub=x?.submission;return `<div class="space"><span class="pill hot">חשיפה · סבב ${r+1}</span><span class="pill">כרטיסייה ${slot+1} מתוך 3</span></div>${ticking('הכרטיסייה הבאה בעוד')}<div class="review-card" style="--accent:${COLORS[slot]}"><span class="letter">קונספט ${NAMES[slot]}</span>${sub?`<h2>${escapeHtml(sub.title)}</h2><p>${escapeHtml(sub.description)}</p>`:`<h2>לא הוגש קונספט</h2>`}</div><p class="center mut">הצבעת הקהל תיפתח אחרי הצגת שלוש הכרטיסיות.</p>`}

function screenResults(){const r=phGroup(S),slot=slotIndex(S),g=S.slots[slot]||slot+1,z=resultPiece(r,g),notes=(S.judgeNotes||[]).filter(x=>x.round===r+1&&x.group===g);return `<section class="panel"><div class="space"><span class="pill hot">תוצאות הקפצה ${r+1}</span><div class="clock" data-timer>${time(S.remaining)}</div></div><div class="progress"><div data-progress></div></div></section><div class="review-card" style="--accent:${gColor(g)}"><div class="eyebrow">כרטיסייה ${NAMES[slot]} · נחשפה זהות הקבוצה</div><h1 style="color:${gColor(g)}">קבוצה ${g}</h1><div class="big-num">${grade(z.total)} <span class="mut" style="font-size:22px">/ 5</span></div><p class="mut small">דירוג סגל: ${grade(z.judges)} · דירוג קהל: ${grade(z.audience)}</p>${notes.length?`<div class="note" style="margin-top:20px"><div class="eyebrow">נימוק הסגל · ${escapeHtml(notes[0].name)}</div><p class="quote">״${escapeHtml(notes[0].reason)}״</p></div>`:`<p class="mut small" style="margin-top:15px">לא התקבל עדיין נימוק מהסגל.</p>`}</div>`}
function screenFinale(){const rank=S.ranking||[],winner=rank[0],tie=rank.length>1&&winner.score===rank[1].score,notes=(S.judgeNotes||[]).filter(x=>x.reason),allNotes=notes.slice(0,8);return `<section class="hero final-winner"><span class="pill hot">תוצאות סופיות</span><h1>${tie?'יש תיקו!':winner?'קבוצה '+winner.group+' מנצחת!':'תודה לכל המשתתפים'}</h1><p class="copy">שלוש הקפצות. תשעה רעיונות. צוות שופטים אחד.</p><div class="grid3" style="margin-top:30px">${rank.map((x,i)=>`<div class="group" style="--group:${gColor(x.group)}"><span class="eyebrow">מקום ${i+1}</span><h3>קבוצה ${x.group}</h3><div class="tally">${grade(x.score)}</div><p>נקודות מתוך 15</p></div>`).join('')}</div></section>${allNotes.length?`<div class="panel"><h3>נימוקים נבחרים של הסגל</h3><div class="grid2" style="margin-top:15px">${allNotes.slice(Math.max(0,slotIndex(S)*2),slotIndex(S)*2+2).map(n=>`<div class="note" style="border-color:${gColor(n.group)}"><span class="small mut">${escapeHtml(n.name)} · קבוצה ${n.group} · סבב ${n.round}</span><p style="font-size:23px">״${escapeHtml(n.reason)}״</p></div>`).join('')||'<p class="mut">תודה לסגל.</p>'}</div></div>`:''}<div class="panel center"><h2>תודה לכל המשתתפים ולסגל</h2><p class="mut">הפעם לא תהיה הקפצה נוספת.</p></div>`}

}
const PC=[{id:'start',title:'התחל משחק'},{id:'pause',title:'השהה / המשך'},{id:'next',title:'לשלב הבא (ידני)'},{id:'add30',title:'הוסף 30 שניות'},{id:'lock',title:'נעל / פתח כניסה'},{id:'reset',title:'איפוס המשחק'}];
function renderAdmin(){const p=S.phase,r=phGroup(S),roster=S.roster||[];return frame(`<div class="space"><div><span class="eyebrow">מנהל · ממשק שליטה</span><h2>לוח הבקרה</h2></div><div class="pill good">ממשק ${BUILD} · שרת ${escapeHtml(S.build)}</div></div><div class="grid3" style="margin-top:17px"><div class="pane center"><div class="eyebrow">משתתפים מחוברים</div><div class="big-num">${roster.length}</div></div><div class="pane center"><div class="eyebrow">שלב</div><div class="big-num">${S.started?PAGES.indexOf(p)+1:0}<span class="mut" style="font-size:17px">/ 14</span></div></div><div class="pane center"><div class="eyebrow">קוד חניכים</div><div class="big-num" style="font-size:38px">${escapeHtml(S.code)}</div></div></div><div class="panel"><div class="space"><div><span class="eyebrow">שלב נוכחי · ${escapeHtml(p)}</span><h3>${phaseTitle(p)}</h3></div><div>${ticking('זמן נותר')}</div></div><div class="btnrow" style="margin-top:18px">${PC.map(x=>`<button class="btn ${x.id==='start'?'primary':x.id==='reset'?'danger':''}" ${x.id==='start'&&S.started?'disabled':''} onclick="admin('${x.id}')">${escapeHtml(x.title)}</button>`).join('')}</div><p class="small mut" style="margin-top:12px">המעברים ידניים בלבד: כשהשעון מגיע ל־00:00 המשחק ממתין ללחיצה על ״לשלב הבא״. זמני התוכן הם 1:00 פתיחה, שלושה סבבי יצירה של 5:00, לכל אחד 2:30 להצגה ולהצבעה, ו־1:30 סיום (25 דקות נטו, ללא המתנות במעברים). המוזיקה פועלת רק במקרן בזמן הפתיחה והכתיבה.</p></div><div class="grid3">${[1,2,3].map(g=>`<div class="group" style="--group:${gColor(g)}"><h3>קבוצה ${g}</h3><div class="big-num">${S.groups[g-1]}</div><div>${roster.filter(x=>x.group===g).map(x=>`<span class="member">${escapeHtml(x.name)} <button title="הוצא משתתף" onclick="admin('kick','${attr(x.id)}')">✕</button></span>`).join('')||'<p class="mut small">אין מחוברים</p>'}</div></div>`).join('')}</div>${(S.pending||[]).length?`<div class="panel"><h3>ממתינים לאישור הצטרפות</h3>${S.pending.map(x=>`<div class="space pane" style="margin-top:10px"><strong>${escapeHtml(x.name)}</strong><div class="btnrow"><button class="btn small alt" onclick="admin('approve','${attr(x.id)}')">אישור</button><button class="btn small danger" onclick="admin('reject','${attr(x.id)}')">דחייה</button></div></div>`).join('')}</div>`:''}<div class="panel"><h3>חיבור מכשירים</h3><p>קוד מפקדים: <strong>18608</strong> · קודי בדיקה: <strong>67420 / 67421</strong></p><p class="small mut" style="margin-top:12px">משתתפים: ${escapeHtml(location.origin)} · מקרן: ${escapeHtml(location.origin)}/#screen · אדמין: ${escapeHtml(location.origin)}/#admin</p><div class="btnrow" style="margin-top:12px"><button class="btn small" onclick="copyLink('/#screen')">העתק קישור למקרן</button><button class="btn small" onclick="copyLink('/')">העתק קישור לחניכים</button></div></div>${S.started?`<div class="panel"><h3>הגשות קבוצה בסבב הנוכחי</h3><div class="grid3" style="margin-top:12px">${[1,2,3].map(g=>`<div class="pane"><h3>קבוצה ${g}</h3><p>${escapeHtml(S.submissions?.[r]?.[g]?.title||'עדיין אין הגשה')}</p></div>`).join('')}</div></div>`:''}`,true)}
function phaseTitle(p){if(p==='lobby')return 'ממתינים לפתיחה';if(p==='intro')return 'פתיחת ההקפצה';if(p==='finale')return 'הכרזת מנצחים ותודה';const r=Number(p.slice(-1)),label=p.replace(/[0-9]/g,'');return `${({write:'יצירת קונספט',reveal:'הצגת כרטיסיות',vote:'הצבעת קהל וסגל',results:'חשיפת תוצאות'})[label]||'משחק'} · סבב ${r}`}
async function admin(action,id){if(action==='kick'&&!confirm('להוציא את המשתתף? תהיה המתנה של 20 שניות ושם חדש בכניסה חוזרת.'))return;if(action==='reset'&&!confirm('לאפס את המשחק, כל ההגשות והציונים?'))return;try{await call('admin',{action,id});await refresh()}catch(e){toast(e.message)}}
function copyLink(route){navigator.clipboard?.writeText(location.origin+route).then(()=>toast('הקישור הועתק')).catch(()=>toast(location.origin+route))}
function previewCard(g,r){const row=S.previewSubmissions?.[r]?.[g];return `<div class="pane fake"><h3 style="color:${gColor(g)}">קבוצה ${g}</h3><p class="mut small">${escapeHtml(S.previewRound?.[r]?.title||'')}</p>${previewPhase==='write'?`<p style="margin-top:12px">${escapeHtml(S.previewRound?.[r]?.prompt||'')}</p><p class="mut small">שדה שם + שדה הסבר</p>`:row?`<p class="strong" style="margin-top:12px">${escapeHtml(row.title)}</p><p>${escapeHtml(row.description)}</p>`:'<p class="mut" style="margin-top:12px">אין עדיין הגשה של הקבוצה.</p>'}</div>`}
function renderPreview(){return frame(`<div class="panel"><h2>מסך בדיקה · ${S.mode===4?'4 מסכים':'3 מסכים'}</h2><p class="mut">בדיקה לקריאה בלבד. אפשר לראות כל סבב בלי להתחיל את המשחק.</p><div class="view-tabs">${[0,1,2].map(r=>`<button class="btn ${previewRound===r?'selected':''}" onclick="previewRound=${r};render()">קונספט ${r+1}</button>`).join('')}</div><div class="view-tabs">${[['write','הגשה'],['reveal','כרטיסיות'],['vote','הצבעה'],['results','תוצאות']].map(([v,t])=>`<button class="btn small ${previewPhase===v?'selected':''}" onclick="previewPhase='${v}';render()">${t}</button>`).join('')}</div></div><div class="grid4 previewgrid" style="grid-template-columns:repeat(${S.mode},minmax(0,1fr))">${[1,2,3].map(g=>previewCard(g,previewRound)).join('')}${S.mode===4?`<div class="pane fake"><h3>מפקדים</h3><p>דירוג 1–5 לכל קונספט, ונימוק חובה.</p><p class="mut">רואים את הקונספט ומסבירים באתר למה ניתן הדירוג.</p></div>`:''}</div><div class="panel"><strong>השרת כעת:</strong> ${escapeHtml(phaseTitle(S.phase))} · <span data-timer>${time(S.remaining)}</span></div>`,true)}
async function refresh(){if(!token)return;try{const next=await call('state');S=next;lastKey=renderKey(next);syncMusic();render()}catch(e){if(e.status===401)lose(e)}}
setInterval(()=>{if(token)call('heartbeat').catch(()=>{});if(token&&(!stream||stream.readyState===2))refresh();if(!token&&cooldownUntil>Date.now()){const box=el('cooldown-note');if(box)box.textContent=`אפשר לנסות שוב בעוד ${Math.ceil((cooldownUntil-Date.now())/1000)} שניות, עם שם חדש.`;}},5000);
setInterval(()=>{if(S&&S.remaining>0&&!S.paused){const now=Date.now();if(!S._clientTime)S._clientTime=now;const diff=Math.floor((now-S._clientTime)/1000);if(diff>0){S.remaining=Math.max(0,S.remaining-diff);S._clientTime+=diff*1000;updateClock()}}},300);
window.addEventListener('hashchange',()=>{if(!token)init();else if(location.hash==='#screen'&&role!=='screen'){logout();init()}else render()});
init();
</script>
</body></html>
