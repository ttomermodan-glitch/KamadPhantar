roup{border-top:5px solid var(--c,#88aaff);background:#14253e;border-radius:14px;padding:18px;border-inline:1px solid #384b62;border-bottom:1px solid #384b62}.group h3{color:var(--c)}.stat{font:900 42px Heebo}.score{font:900 clamp(30px,5vw,62px) Heebo}.form-note{background:#21384e;border-radius:10px;border-right:4px solid var(--cyan);padding:13px 15px;color:#e1eefb}.help{margin-top:10px;color:#a7bdd6;font-size:15px}.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#20415b;color:#fff;padding:13px 20px;border:1px solid #6a93ba;border-radius:14px;z-index:100;box-shadow:0 9px 40px #0009;display:none;max-width:90vw;text-align:center}.toast.show{display:block}.team-members{margin-top:10px;font-size:15px;color:#cad5e6}.member{display:inline-flex;align-items:center;border-radius:8px;background:#253955;border:1px solid #48627f;padding:5px 9px;margin:3px;gap:7px}.member button{background:transparent;border:0;color:#ffabb6;cursor:pointer}.card-product{background:linear-gradient(140deg,#253b59,#0e1b2f);border:1px solid #627b98;border-top:7px solid var(--c);border-radius:22px;box-shadow:0 22px 60px #0006;padding:clamp(24px,3.6vw,50px);margin:16px auto;max-width:1160px;position:relative}.card-product h1{font-size:clamp(47px,5.2vw,95px);margin:9px 0 20px;overflow-wrap:anywhere}.card-product .price{font-family:Heebo;font-weight:900;font-size:clamp(37px,5vw,70px);color:var(--gold)}.card-product .description{font-size:clamp(20px,2.5vw,34px);line-height:1.5;white-space:pre-wrap}.card-product .slogan{font-size:clamp(22px,3vw,42px);font-weight:900;color:#b0ebff;margin:15px 0 0}.pitch-number{font:900 clamp(40px,5vw,68px) Heebo;color:var(--gold)}.question{padding:18px 24px;border:1px solid #b99b5b;border-right:5px solid var(--gold);border-radius:14px;background:#343044;color:#fff;max-width:1160px;margin:14px auto;font-size:clamp(20px,2.4vw,34px)}.question strong{color:var(--gold)}.metric{background:#14263c;border-radius:14px;padding:15px;text-align:center;border:1px solid #3b5270}.metric b{font:900 40px Heebo}.vote-card{border:1px solid #3d5975;background:#14243a;padding:18px;border-radius:16px;margin:12px 0}.vote-card h3{margin:12px 0}.stars{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.stars button{min-width:47px;flex:1;max-width:85px}.judges-note{background:#1d3148;border-right:4px solid #8ac8de;border-radius:12px;padding:13px 17px;margin:10px 0}.display .hero{padding:54px 34px}.display h1{font-size:clamp(54px,7.6vw,130px)}.display .pitch-label{font-size:clamp(22px,3vw,45px)}.display .timer{font-size:clamp(65px,8vw,120px)}.display .lead{font-size:clamp(25px,2.7vw,45px)}.quick{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.quick button{flex:1;font-size:14px}.qr-layout{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:26px;align-items:center;max-width:840px;margin:30px auto 10px}.qr-box{background:#fff;padding:10px;border-radius:15px}.qr-box img{display:block;width:100%}.join-code{font:900 clamp(72px,10vw,145px) Heebo;letter-spacing:.07em}.sound-desk{position:fixed;left:14px;bottom:14px;background:#0b1624ed;z-index:90;padding:10px 13px;border-radius:14px;border:1px solid #57728a;font-size:13px;width:min(350px,calc(100vw - 28px));box-shadow:0 10px 30px #000a}.sound-desk .btn{min-height:30px;padding:5px 8px;font-size:12px}.sound-desk .buttons{margin:6px 0}.footer{color:#6f849e;text-align:center;font-size:12px;margin:30px 0 0}.locked{border:1px solid #447f6e;padding:18px;border-radius:14px;background:#15352e}.notice{padding:13px;border-radius:10px;border:1px solid #9c7c50;background:#352d33;color:#ffe6c1}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tabs button{min-width:78px}.set-list{display:flex;flex-direction:column;gap:8px}.standby{min-height:66vh;display:flex;flex-direction:column;align-items:center;justify-content:center}.theater .topbar,.theater .footer{display:none}.theater .wrap{padding-top:16px}.theater .sound-desk{display:none}.no-overflow{overflow-wrap:anywhere;white-space:pre-wrap}

<body><div id="app"></div><div id="toast" class="toast" aria-live="polite"></div><audio id="music" preload="none"></audio>
<script>
'use strict';
const BUILD='2026.11.11-pitch.1',COLORS=['#7fcdf0','#f7bc66','#c8a8ff'],SONGS=['Hakpaza.mp3','Hapaza2.mp3','Hapaza3.mp3'];
const el=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,ch=>'&#'+ch.charCodeAt(0)+';'),c=g=>COLORS[(g-1+3)%3],fmt=n=>String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')+':'+String(Math.max(0,n)%60).padStart(2,'0'),round=x=>Math.max(0,(x?.round||1)-1),fscore=x=>x===undefined||x===null?'—':Number(x).toFixed(2),money=x=>String(x||'לא צוין');
let token=sessionStorage.getItem('pitch_token')||'',role='',S=null,es=null,key='',busy=false,login={code:'',name:''},password='',toastHandle=null,drafts={},judgeDrafts={},questionDraft='',seedDraft='',cooldownUntil=0,previousName='',previewRound=0,previewStage='write';
let soundEnabled=false,soundMuted=false,track=0,fade=null,fadeDone=false,blocked=false,musicError='';
const audio=el('music');
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>t.classList.remove('show'),3500)}
async function api(name,data={},auth=true){let r;try{r=await fetch('/api/'+name,{method:'POST',headers:{'Content-Type':'application/json',...(auth?{'x-session':token}:{})},body:JSON.stringify(data)})}catch{throw new Error('אין חיבור לשרת')};const j=await r.json().catch(()=>({error:'תגובה לא תקינה'}));if(!r.ok){const err=new Error(j.error||'הפעולה נכשלה');err.info=j;err.status=r.status;throw err}return j}
function setAuth(x){token=x.token;role=x.role;sessionStorage.setItem('pitch_token',token);key='';connect()}
function logout(){es?.close();es=null;sessionStorage.removeItem('pitch_token');token='';role='';S=null;key='';audio.pause();render()}
function onRevoked(e){let x={};try{x=JSON.parse(e.data)}catch{}cooldownUntil=x.kickUntil||0;previousName=x.previousName||'';logout();toast('נותקת מהמשחק. אפשר להתחבר מחדש אחרי ההמתנה עם שם חדש.')}
function isPresentation(){return location.hash==='#presentation'}
function primaryScreen(){return role==='screen'&&!isPresentation()}
function musicLive(){return primaryScreen()&&S&&['intro','write1','write2','write3'].includes(S.phase)&&!S.paused&&S.remaining>0}
function loadTrack(i){track=(i+3)%3;audio.src='/'+SONGS[track];audio.load();musicStatus()}
function stopFade(){if(fade)clearInterval(fade);fade=null}
function fadeStart(){if(fadeDone||track!==0)return;fadeDone=true;stopFade();audio.volume=.72;const t=Date.now();fade=setInterval(()=>{const p=Math.min(1,(Date.now()-t)/7000);audio.volume=.72+(.10-.72)*p;if(p===1)stopFade()},150)}
function syncMusic(){if(!primaryScreen()){audio.pause();return}if(!musicLive()||!soundEnabled){audio.pause();musicStatus();return}if(!audio.src||!audio.src.includes(SONGS[track]))loadTrack(track);if(track!==0||fadeDone)audio.volume=.10;if(audio.paused)audio.play().then(()=>{if(track===0&&!fadeDone)fadeStart();blocked=false;musicStatus()}).catch(()=>{blocked=true;musicStatus()})}
function toggleSound(){if(!soundEnabled){soundEnabled=true;blocked=false;musicError='';if(!audio.src)loadTrack(0);const p=audio.play();p?.then(()=>{if(!musicLive())audio.pause();else if(track===0&&!fadeDone)fadeStart();musicStatus()}).catch(()=>{blocked=true;musicStatus()})}else{soundEnabled=false;audio.pause();stopFade();musicStatus()}}
function nextTrack(){stopFade();loadTrack(track+1);audio.volume=.10;syncMusic()}
function muteSound(){soundMuted=!soundMuted;audio.muted=soundMuted;musicStatus()}
audio.addEventListener('ended',()=>{if(musicLive()&&soundEnabled)nextTrack()});
audio.addEventListener('error',()=>{if(!soundEnabled)return;musicError='לא ניתן לנגן את '+SONGS[track]+'. בדקו שהקובץ נמצא בתיקיית public.';soundEnabled=false;musicStatus()});
function musicStatus(){const l=el('sound-line'),a=el('sound-toggle'),b=el('sound-mute');if(l)l.textContent=musicError||('♫ '+SONGS[track]+' · '+(musicLive()?(soundEnabled?(blocked?'לחצו שוב כדי לאפשר שמע':'מוכן לניגון'):'לחצו להפעלת שמע'):'מושהה בזמן הצגה, הצבעה ותוצאות'));if(a)a.textContent=soundEnabled?'עצור מוזיקה':'הפעל מוזיקה';if(b)b.textContent=soundMuted?'בטל השתקה':'השתק'}
function musicUI(){return `<aside class="sound-desk"><strong>♫ פלייליסט מסך ההקרנה</strong><div class="buttons"><button class="btn sm" onclick="toggleSound()" id="sound-toggle">הפעל מוזיקה</button><button class="btn sm" onclick="nextTrack()">השיר הבא</button><button class="btn sm" onclick="muteSound()" id="sound-mute">השתק</button></div><div id="sound-line">Hakpaza → Hapaza2 → Hapaza3</div></aside>`}
async function init(){if(location.hash==='#screen'||isPresentation()){const x=await api('screen',{},false).catch(e=>{toast(e.message);return null});if(x)setAuth(x);return}if(token){const x=await api('resume',{token}).catch(()=>null);if(x){setAuth(x);return}logout()}render()}
function connect(){es?.close();render();es=new EventSource('/api/stream?token='+encodeURIComponent(token));es.addEventListener('state',ev=>{try{const s=JSON.parse(ev.data),k=renderKey(s);S=s;syncMusic();if(k!==key){key=k;render()}else clockUI()}catch(e){console.warn(e)}});es.addEventListener('revoked',onRevoked);es.onerror=()=>{const n=el('net');if(n)n.textContent='מתחבר מחדש...'}}
function renderKey(s){let k=role+'|'+s.phase+'|'+s.paused+'|'+(s.remaining===0?'done':'on');if(role==='admin')return k+'|'+s.version;if(role==='screen')return k+'|'+(s.phase==='lobby'||s.phase.startsWith('pitch')||s.phase.startsWith('results')||s.phase==='finale'?s.version:0)+'|'+isPresentation();if(role==='player')return k+'|'+s.myGroup+'|'+(s.mySubmission?.updatedAt||0)+'|'+JSON.stringify(s.myVotes||{})+'|'+(s.presentation?.question||'');if(role==='judge')return k+'|'+JSON.stringify(s.myRatings||{})+'|'+s.presentationGroup+'|'+s.seedCount;if(role==='preview')return k+'|'+previewRound+'|'+previewStage;return k}
function header(){return `<header class="topbar"><div class="brand"><b>NEWS</b>404 <span class="subbrand">${S?.started?'הקפצה! · קרב המכירות':'פעילות מחלקה'}</span></div><div class="trow"><span class="tag" id="net">● ${S?'מחוברים':'מתחברים...'}</span>${role&&role!=='screen'?`<button class="btn sm ghost" onclick="logout()">יציאה</button>`:''}</div></header>`}
function frame(content,wide=false){document.title=S?.started?'NEWS404 | הקפצה! קרב המכירות':'NEWS404 | פעילות מחלקה';document.body.classList.toggle('theater',isPresentation());el('app').innerHTML=`<main class="wrap ${wide?'wide':''}">${header()}${content}<div class="footer">NEWS404 · ${BUILD}${S?.build?' · שרת '+esc(S.build):''}</div></main>${primaryScreen()?musicUI():''}`;clockUI();musicStatus()}
function clockUI(){if(!S)return;for(const x of document.querySelectorAll('[data-timer]'))x.textContent=fmt(S.remaining);for(const x of document.querySelectorAll('[data-progress]'))x.style.width=(S.duration?Math.min(100,Math.max(0,100*S.remaining/S.duration)):0)+'%';for(const x of document.querySelectorAll('[data-pause]'))x.textContent=S.paused?'מושהה':S.remaining===0?'ממתינים למנהל':''}
function timerBlock(label){return `<div class="row"><div><div class="eyebrow">${esc(label)}</div><div class="timer" data-timer>${fmt(S.remaining)}</div></div><span class="tag" data-pause>${S.paused?'מושהה':S.remaining===0?'ממתינים למנהל':''}</span></div><div class="track"><div data-progress></div></div>`}
function render(){if(!token)return renderLogin();if(!S)return frame(`<div class="hero"><h2>מתחברים לשרת...</h2></div>`);if(role==='admin')return renderAdmin();if(role==='screen')return renderScreen();if(role==='judge')return renderJudge();if(role==='preview')return renderPreview();return renderPlayer()}
function renderLogin(){const admin=location.hash==='#admin';return frame(`<section class="hero"><span class="tag">NEWS404</span><h1>${admin?'לוח הבקרה':'פעילות מחלקה'}</h1><p class="lead">${admin?'התחברות מנהל':'הכניסו קוד ושם כדי להצטרף לקבוצה'}</p></section><div class="panel" style="max-width:560px;margin:18px auto"><form onsubmit="${admin?'loginAdmin(event)':'join(event)'}">${admin?`<label>סיסמת מנהל</label><input type="password" autocomplete="current-password" value="${esc(password)}" oninput="password=this.value" required>`:`<label>קוד כניסה</label><input inputmode="numeric" maxlength="5" pattern="[0-9]*" placeholder="00000" oninput="login.code=this.value" value="${esc(login.code)}" required><label>שם פרטי או כינוי</label><input maxlength="28" oninput="login.name=this.value" value="${esc(login.name)}" placeholder="מה השם שלכם?" required>${cooldownUntil>Date.now()?`<div class="notice" style="margin-top:12px">אפשר להתחבר שוב בעוד ${Math.ceil((cooldownUntil-Date.now())/1000)} שניות בשם חדש.</div>`:''}`}<button class="btn primary full" style="margin-top:18px" type="submit" ${busy?'disabled':''}>${admin?'התחברות':'כניסה למשחק'}</button></form></div>${!admin?`<div class="center"><button class="btn ghost sm" onclick="location.hash='#admin';render()">ניהול המשחק</button></div>`:''}`)}
async function join(e){e.preventDefault();if(busy)return;busy=true;try{let dev=localStorage.getItem('pitch_device');if(!dev){dev=crypto.randomUUID();localStorage.setItem('pitch_device',dev)}setAuth(await api('join',{...login,device:dev},false))}catch(e){if(e.info?.kickUntil){cooldownUntil=e.info.kickUntil;previousName=e.info.previousName||''}toast(e.message);render()}finally{busy=false}}
async function loginAdmin(e){e.preventDefault();try{setAuth(await api('login',{password},false));password=''}catch(e){toast(e.message)}}

}
const CONTROLS=[['start','התחל משחק'],['pause','השהה / המשך'],['next','לשלב הבא (ידני)'],['add30','הוסף 30 שניות'],['lock','נעל / פתח כניסה'],['reset','איפוס המשחק']];
function adminSubmissions(){return `<div class="panel"><h2>ניהול הגשות</h2><p class="help">הגשה אחת לכל קבוצה בכל סבב. מחיקה מוחקת גם דירוגים והצבעות. הגשה מחדש אפשרית רק בזמן יצירה.</p>${[0,1,2].map(r=>`<div class="tile" style="margin-top:15px"><h3>סבב ${r+1}</h3><div class="grid3" style="margin-top:12px">${[1,2,3].map(g=>{const x=S.submissions?.[r]?.[g];return `<div class="group" style="--c:${c(g)}"><h3>קבוצה ${g}</h3>${x?`<h3 style="margin:11px 0">${esc(x.title)}</h3><p class="small">${esc(x.description)}</p><p class="highlight small">${esc(x.price)} · ${esc(x.slogan)}</p><p class="help">הגיש/ה ${esc(x.author)}</p><button class="btn danger sm" onclick="deleteProduct(${r},${g})">מחק מוצר</button>`:'<p class="help">טרם הוגש</p>'}</div>`}).join('')}</div></div>`).join('')}</div>`}
function renderAdmin(){const roster=S.roster||[],p=S.phase;return frame(`<div class="row"><div><span class="eyebrow">ניהול משחק</span><h1 style="font-size:40px">הכרישים של קמ״ד</h1></div><span class="tag good">ממשק ${BUILD} · שרת ${esc(S.build)}</span></div><div class="grid3" style="margin-top:20px"><div class="metric"><div class="eyebrow">חניכים מחוברים</div><b>${roster.length}</b></div><div class="metric"><div class="eyebrow">שלב</div><b>${S.stage}<span class="small muted">/${S.totalStages}</span></b></div><div class="metric"><div class="eyebrow">קוד חניכים</div><b>${esc(S.code)}</b></div></div><div class="panel"><div class="row"><div><span class="eyebrow">שלב נוכחי</span><h2>${esc(S.stageLabel)}</h2><p class="help">${esc(p)} ${S.presentationGroup?'· קבוצה '+S.presentationGroup:''}</p></div>${timerBlock('זמן נותר')}</div><div class="buttons" style="margin-top:20px">${CONTROLS.map(([id,label])=>`<button class="btn ${id==='start'?'primary':id==='reset'?'danger':''}" onclick="admin('${id}')" ${id==='start'&&S.started?'disabled':''}>${label}</button>`).join('')}</div><p class="help"><strong>המעברים ידניים בלבד.</strong> ב־00:00 השעון נעצר. לכל מוצר יש 30 שניות הצגה, ולכל סבב הצבעות של 45 שניות ותוצאות של 15 שניות. עליך להעביר גם בין הקבוצות המציגות.</p></div><div class="panel"><h3>מסכים וקישורים</h3><div class="buttons" style="margin-top:13px"><button class="btn" onclick="openPage('/#screen')">פתח מקרן ראשי</button><button class="btn" onclick="openPage('/#presentation')">פתח מסך הצגה</button><button class="btn" onclick="copyPage('/')">העתק קישור לחניכים</button></div><p class="help">כניסת סגל: <b>18608</b> · קודי בדיקה: <b>67420 / 67421</b> · סיסמת מנהל: משתנה הסביבה ADMIN_PASSWORD או ברירת מחדל מקומית.</p></div><div class="grid3">${[1,2,3].map(g=>`<div class="group" style="--c:${c(g)}"><h3>קבוצה ${g}</h3><div class="stat">${S.groups[g-1]}</div><div class="team-members">${roster.filter(x=>x.group===g).map(x=>`<span class="member">${esc(x.name)} <button onclick="admin('kick','${esc(x.id)}')">✕</button></span>`).join('')||'אין מחוברים'}</div></div>`).join('')}</div>${(S.pending||[]).length?`<div class="panel"><h3>ממתינים לאישור כניסה</h3>${S.pending.map(x=>`<div class="row tile" style="margin-top:9px"><b>${esc(x.name)}</b><div class="buttons"><button class="btn sm green" onclick="admin('approve','${esc(x.id)}')">אשר</button><button class="btn sm danger" onclick="admin('reject','${esc(x.id)}')">דחה</button></div></div>`).join('')}</div>`:''}<div class="panel"><h3>הצעות הסגל לסבב השלישי</h3><p class="help">${(S.seedWords||[]).length?S.seedWords.map(x=>esc(x.name)+' הציע/ה: '+esc(x.word)).join(' · '):'עוד לא הוצעו חפצים.'}</p>${Object.keys(S.challenges||{}).length?`<div class="grid3" style="margin-top:12px">${[1,2,3].map(g=>`<div class="tile"><h3>קבוצה ${g}</h3><p>${esc(S.challenges[g]?.object)} + ${esc(S.challenges[g]?.limit)}</p></div>`).join('')}</div>`:''}</div>${S.started?adminSubmissions():''}`,true)}
async function admin(action,id){if(action==='kick'&&!confirm('להוציא את המשתתף? הוא יוכל לחזור אחרי 20 שניות בשם אחר.'))return;if(action==='reset'&&!confirm('לאפס את כל המשחק והניקוד?'))return;try{await api('admin',{action,id});await refresh()}catch(e){toast(e.message)}}
async function deleteProduct(r,g){if(!confirm('למחוק מוצר של קבוצה '+g+' בסבב '+(r+1)+'? ההצבעות והציונים שלו יימחקו.'))return;try{await api('admin',{action:'deleteConcept',round:r,group:g});toast('המוצר נמחק');await refresh()}catch(e){toast(e.message)}}
function openPage(route){window.open(location.origin+route,'_blank','noopener,noreferrer')}
function copyPage(route){navigator.clipboard?.writeText(location.origin+route).then(()=>toast('הקישור הועתק')).catch(()=>toast(location.origin+route))}
function renderPreview(){const r=previewRound;return frame(`<div class="panel"><h2>מסך בדיקה · ${S.mode===4?'4 תצוגות':'3 תצוגות'}</h2><p class="help">קריאה בלבד. אפשר לעבור בין סבבים בלי לשנות את המשחק.</p><div class="tabs">${[0,1,2].map(i=>`<button class="btn sm ${i===r?'active':''}" onclick="previewRound=${i};render()">סבב ${i+1}</button>`).join('')}</div><div class="tabs">${[['write','הגשה'],['pitch','הצגה'],['vote','הצבעה'],['results','תוצאה']].map(([id,n])=>`<button class="btn sm ${id===previewStage?'active':''}" onclick="previewStage='${id}';render()">${n}</button>`).join('')}</div></div><div class="grid3">${[1,2,3].map(g=>{const x=S.previewSubmissions?.[r]?.[g];return `<div class="group" style="--c:${c(g)}"><h3>קבוצה ${g}</h3><h3 style="margin:12px 0">${esc(x?.title||'טרם הוגש')}</h3><p>${previewStage==='write'?esc(S.previewRound?.[r]?.prompt||''):esc(x?.description||'לא קיים תוצר לבדיקה')}</p><p class="highlight">${esc(x?.slogan||'')}</p></div>`}).join('')}</div><div class="panel"><p>השלב האמיתי כרגע: <strong>${esc(S.stageLabel)}</strong></p></div>`,true)}
async function refresh(){if(!token)return;try{const s=await api('state');S=s;key=renderKey(s);syncMusic();render()}catch(e){if(e.status===401)logout()}}
setInterval(()=>{if(token){api('heartbeat').catch(()=>{});if(!es||es.readyState===2)refresh()}if(!token&&cooldownUntil>Date.now()){const x=document.querySelector('.notice');if(x)x.textContent='אפשר לנסות שוב בעוד '+Math.ceil((cooldownUntil-Date.now())/1000)+' שניות בשם חדש.'}},5000);
setInterval(()=>{if(!S||S.paused||S.remaining<=0)return;const now=Date.now();if(!S._clientTime)S._clientTime=now;const diff=Math.floor((now-S._clientTime)/1000);if(diff>0){S.remaining=Math.max(0,S.remaining-diff);S._clientTime+=diff*1000;clockUI()}},280);
window.addEventListener('hashchange',()=>{if(location.hash==='#screen'||isPresentation()){logout();init()}else if(token){render();syncMusic()}else init()});
init();
</script></body></html>
