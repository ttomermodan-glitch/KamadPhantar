 if(TESTPHASE==="live"&&G.fl)content+=flash(p);
 }else if(p==="win")content="הצגת התוצרים הזוכים והדירוגים";

const phases=[["r1","יום 1"],["r2","יום 6"],["r3","יום 12"],["r4","יום 20"],["r5","יום 30"],["live","שידור חי"]];

}

<div class="card"><h3>לוח בקרה</h3><p class="mut">גרסה ${BUILD} · שרת: ${esc(G.build||"בודק...")}</p><div class="g3"><div><b>${np()}</b>משתתפים מחוברים</div><div><b>${r?cn():0}</b>הגשות</div><div><b>${pad(i)}/16</b>שלב</div></div></div>
<div class="card"><p class="mut">שלב נוכחי</p><h3>${ttl(G.ph)}</h3><p>${st}</p>${L?`<p class="mut">הצטרפו: ${TK.map(t=>T[t][1]+" "+roster(t).length).join(" · ")}</p>`:""}${(/^show[2-5]?$/.test(G.ph)||G.ph==="win")?`<p class="mut">${G.sub.length} תוצרים · ${(G.rc||0)} דירוגים</p>`:""}${clock()}${r?`<p class="mut">${TK.map(t=>T[t][0]+" "+G.sub.filter(x=>x.t===t&&x.r===G.ph).length).join(" · ")}</p>`:""}<p class="mut">מבט מקדים, רק לך: ${pre}</p>
<div class="ctl"><button class="go" onclick="act('nx')">${L?"התחל":"השלב הבא"}</button><button onclick="act('ps')" ${d(!r)}>${G.pause?"המשך":"השהה"}</button><button onclick="act('cl')" ${d(!r||G.lock)}>סגור סבב</button><button onclick="act('tm')" ${d(!r||G.lock)}>הוסף 30 שניות</button><button onclick="act('tw')" ${d(!r)}>מבזק פתע</button><button onclick="act('lk')">${G.locked?"פתח כניסה":"נעל כניסה"}</button><button style="display:none" onclick="act('sn')" ${d(G.ph!=="show")}>הצג רעיון הבא</button><button style="display:none" onclick="act('sa')" ${d(G.ph!=="show")}>הצג הכול</button><button style="grid-column:1/-1" onclick="act('wn')" ${d(G.ph!=="win")}>חשוף מנצח הבא</button><button style="grid-column:1/-1" onclick="act('rs')">איפוס משחק</button></div></div>`+adminRoster()+factsCard(G.ph)+conn()+tcard()+``}
function cmpCard(){if(!G.cmp)return"";return `<div class="card"><h3>מה רואים המשתתפים</h3><div class="pv">${play()}</div></div><div class="card"><h3>מה רואים בהקרנה</h3><div class="pv">${screen()}</div></div>`}
function tcard(){return `<div class="card"><h3>משך המשחק המלא</h3><p>5 תחנות לאורך חודש × 3 דקות = 15 דקות. ארבע התפתחויות עלילתיות ופתיחה = כ־3 דקות. הצגת תוצרים ודירוג אחרי כל סבב: מומלץ 75 שניות × 5 = 6:15 דקות. סיכום והכרזת מנצחים: דקה עד שתיים. <b>סה״כ: כ־25 דקות</b>.</p><p class="mut">השלבים הקולנועיים והתוצרים מתקדמים אוטומטית. מצב הרצה אוטומטית מהירה מיועד רק לבדיקות ומקצר את הזמנים. אפשר להשהות או לדלג ידנית בלוח הבקרה.</p></div><div class="card"><h3>בדיקה והדגמה</h3><div class="ctl"><button class="go" onclick="act('au')">${G.auto?"עצור בדיקה מהירה":"בדיקה מהירה (מקצר זמנים)"}</button><button onclick="act('rs')">התחלה מחדש</button></div></div>`}

const s=G.ph+"|"+G.fl,[p0,f0]=LS.split("|");
if(s!==LS){
if(G.ph!==p0&&G.ph!=="lobby"){if(/^show[2-5]?$/.test(G.ph)){[392,523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.5,"triangle"),i*140))}else{beep(880,.15,"square");setTimeout(()=>beep(660,.3,"square"),170)}}

function applySnap(d){
const previousRound=G.ph,previousLock=G.lock,previousSent=Boolean(G.sent?.[G.ph]),previousJoined=G.joined,previousWait=G.wait;
if(d.ph&&d.ph!==previousRound&&/^r[1-5]$/.test(d.ph)){DF={};ERR="";SENDING=false}
if(d.codes){TC=d.codes.TC||TC;if(d.codes.CC)CC=d.codes.CC;delete d.codes}
if(d.me!==undefined){const m=d.me;G.joined=m&&m.st==="in"?1:0;G.wait=m&&m.st==="wait"?1:0;if(m){G.trk=m.trk;G.name=m.name;G.sent=m.sent||{};if(m.st==="no"){ERR="הבקשה נדחתה על ידי המנהל.";dropMe()}else if(m.st==="kicked"){COOLDOWN=m.kickUntil||Date.now()+20000;PREVIOUS_NAME=m.name;DR.n="";ERR="הוצאת מהמשחק. ניתן לבקש כניסה מחדש בעוד 20 שניות, בשם אחר.";dropMe()}}delete d.me}
if(d.my){MY=d.my;delete d.my}
Object.assign(G,d);LINK=1;
// A typed answer stays in focus during timer updates, but a new stage,
// a closed round or a confirmed submission must redraw immediately.
const structuralChange=G.ph!==previousRound||G.lock!==previousLock||Boolean(G.sent?.[G.ph])!==previousSent||G.joined!==previousJoined||G.wait!==previousWait;
if(structuralChange)draw();else tickDraw()}
function dropMe(){ME=null;CM=0;TESTMODE=0;G.joined=0;G.wait=0;try{sessionStorage.removeItem("me");sessionStorage.removeItem("testMode");sessionStorage.removeItem("testPhase")}catch(e){}if(ES){ES.close();ES=null}draw()}
function connect(){if(ES){ES.close();ES=null}LINK=0;
const q=V==="screen"?"role=s":(V==="admin"&&TOK)?"role=a&tok="+TOK:ME?"role="+(ME.role==="c"?"c":ME.role==="v"?"v":"p")+"&id="+ME.id:"";
if(!q)return;const es=new EventSource("/api/stream?"+q);ES=es;
es.onmessage=e=>applySnap(JSON.parse(e.data));
es.onerror=()=>{LINK=0;if(es.readyState===2){if(V==="admin"){AUTH=0;TOK="";try{sessionStorage.removeItem("tok")}catch(e){}V="alogin";draw()}else if(ME)dropMe()}}}
try{ME=JSON.parse(sessionStorage.getItem("me")||"null");TOK=sessionStorage.getItem("tok")||"";if(TOK)AUTH=1;if(ME&&ME.role==="c"){CM=1;CMN="מפקד"}if(ME&&ME.role==="v")TESTMODE=Number(sessionStorage.getItem("testMode")||3);TESTPHASE=sessionStorage.getItem("testPhase")||"r1"}catch(e){}
route();
// A 5-second heartbeat allows the server to reconcile live participants.
setInterval(()=>{if(COOLDOWN>Date.now()&&document.getElementById("cooldown")){document.getElementById("cooldown").textContent=`לאחר הוצאה: ${Math.ceil((COOLDOWN-Date.now())/1000)} שניות עד כניסה חוזרת. יש לבחור שם חדש.`}else if(document.getElementById("cooldown"))document.getElementById("cooldown").textContent="";if(ME&&ME.role==="p"&&document.visibilityState!=="hidden"){
 api("ping",{id:ME.id}).then(x=>{if(x.err==="inactive"){if(x.kickUntil){COOLDOWN=x.kickUntil;PREVIOUS_NAME=x.previousName||"";DR.n="";ERR="הוצאת מהמשחק. המתינו 20 שניות ובחרו שם חדש."}else ERR="החיבור הסתיים. אפשר להיכנס שוב.";dropMe()}});
}},5000);
// Notify the server when a participant deliberately closes or leaves the page.
addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&ME&&ME.role==="p")api("ping",{id:ME.id})});
addEventListener("pagehide",()=>{if(ME&&ME.role==="p"){
 const id=ME.id;try{navigator.sendBeacon("/api/leave",new Blob([JSON.stringify({id,temporary:1})],{type:"application/json"}))}catch(e){}
}});
</script></body></html>
